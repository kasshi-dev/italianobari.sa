<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E4430" />
    <!--
      Browser auto-translate rewrites the DOM outside React's control, which
      makes the next React commit throw
      "Failed to execute 'insertBefore' on 'Node'". Keep the document
      untranslated; the site ships its own Arabic/English content.
    -->
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      content="Italiano Bari — قائمة الطعام وبرنامج الولاء والمكافآت. Menu and loyalty rewards."
    />
    <title>Italiano Bari — القائمة والمكافآت</title>
    <link rel="icon" type="image/png" href="/menu/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,600&family=Cairo:wght@400;600;700;800;900&family=Reem+Kufi:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
